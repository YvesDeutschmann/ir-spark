[project]
name = "ir-spark"
version = "0.1.0"
description = "Personal Splink-on-Spark entity-resolution proof of concept for public company records"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.28.0",
    "pandas>=2.2,<3",
    "splink[spark]>=4.0.16",
]

[project.scripts]
ir-spark = "ir_spark.__main__:main"
ir-spark-download = "ir_spark.download:main"
ir-spark-sample = "ir_spark.sample:main"
ir-spark-profile = "ir_spark.profile:main"
ir-spark-smoke = "ir_spark.smoke:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
